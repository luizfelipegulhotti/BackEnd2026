name: Pipeline CI/CD - Concessionária API

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # JOB 1: Integração Contínua (CI) - Build e Testes
  build-and-test:
    name: Build & Testes
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout do código
      uses: actions/checkout@v4

    - name: 🟢 Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 📦 Instalar dependências
      run: npm ci

    - name: 🗄️ Gerar Prisma Client
      run: npx prisma generate

    - name: 🧪 Rodar Testes (Jest)
      run: npm test

    - name: 🏗️ Rodar Build (TypeScript)
      run: npx tsc --noEmit

  # JOB 2: Entrega Contínua (CD) - Build da Imagem Docker
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test # Só roda se os testes passarem
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: 📥 Checkout do código
      uses: actions/checkout@v4

    - name: 🐳 Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🏗️ Build da Imagem Docker (Simulando Deploy)
      run: |
        docker build -t concessionaria-api:${{ github.sha }} .
        docker build -t concessionaria-api:latest .